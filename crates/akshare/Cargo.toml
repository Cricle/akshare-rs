[package]
name = "akshare"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "100% pure Rust implementation of akshare — unified access to Chinese and global financial market data APIs"
repository.workspace = true
homepage = "https://github.com/Cricle/akshare-rs"
documentation = "https://docs.rs/akshare"
readme = "../../README.md"
keywords = ["akshare", "finance", "stock", "china", "market-data"]
categories = ["api-bindings", "finance"]
exclude = ["/tests", "/.github", "/.gitignore"]

[features]
# --- Fine-grained module features ---
mod-stock = []
mod-index = []
mod-futures = []
mod-option = []
mod-fund = []
mod-bond = []
mod-reits = []
mod-macro_data = []
mod-economy = []
mod-forex = []
mod-crypto = []
mod-commodity = []
mod-spot = []
mod-news = []
mod-bank = []
mod-cal = []
mod-ta = []
mod-tool = []

# --- Category features (aggregated) ---
equity = ["mod-stock", "mod-index"]
derivatives = ["mod-futures", "mod-option"]
funds = ["mod-fund", "mod-bond", "mod-reits"]
macro = ["mod-macro_data", "mod-economy"]
fx-commodity = ["mod-forex", "mod-crypto", "mod-commodity", "mod-spot"]
misc = ["mod-news", "mod-bank", "mod-cal", "mod-ta", "mod-tool"]

# --- Market client (existing, unchanged) ---
market-client = [
    "dep:reqwest-middleware", "dep:reqwest-tracing", "dep:opentelemetry",
    "dep:tracing", "dep:futures", "dep:anyhow",
    "tokio/macros",
]

# --- Aggregation ---
all = ["equity", "derivatives", "funds", "macro", "fx-commodity", "misc", "market-client"]
default = ["all"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"
tokio = { version = "1", features = ["time"] }
sha2 = "0.10"
calamine = "0.26"
rust_decimal = { version = "1", features = ["serde-with-str"] }

# Optional deps for market-client feature
reqwest-middleware = { version = "0.4", features = ["json"], optional = true }
reqwest-tracing = { version = "0.5", features = ["opentelemetry_0_28"], optional = true }
tracing = { version = "0.1", optional = true }
futures = { version = "0.3", optional = true }
anyhow = { version = "1", optional = true }
opentelemetry = { version = "0.28", optional = true }

# --- Integration test feature gates ---
# Tests that only use provider methods (always available) need no features.
[[test]]
name = "mock_smoke"
required-features = []

[[test]]
name = "mock_provider"
required-features = []

# Equity tests (stock + index)
[[test]]
name = "stock_core"
required-features = ["mod-stock"]

[[test]]
name = "stock_board"
required-features = ["mod-stock"]

[[test]]
name = "stock_feature"
required-features = ["mod-stock", "mod-news"]

[[test]]
name = "mock_stock"
required-features = ["mod-stock", "mod-news"]

[[test]]
name = "index"
required-features = ["mod-index"]

# Derivatives tests
[[test]]
name = "futures"
required-features = ["mod-futures", "mod-tool"]

[[test]]
name = "mock_futures"
required-features = ["mod-futures"]

[[test]]
name = "option"
required-features = ["mod-option"]

[[test]]
name = "mock_option"
required-features = ["mod-option"]

[[test]]
name = "futures_option"
required-features = ["mod-futures", "mod-option"]

# Funds & Fixed Income tests
[[test]]
name = "bond"
required-features = ["mod-bond"]

[[test]]
name = "fund"
required-features = ["mod-fund"]

# Macro & Economy tests
[[test]]
name = "macro_data"
required-features = ["mod-macro_data", "mod-bond"]

[[test]]
name = "mock_economy"
required-features = ["mod-economy"]

# News tests
[[test]]
name = "mock_news"
required-features = ["mod-news"]

# Error tests use stock_zh_a_spot + macro_china_gdp methods
[[test]]
name = "mock_errors"
required-features = ["mod-stock", "mod-macro_data"]

# misc.rs and e2e.rs cover many modules — require all
[[test]]
name = "misc"
required-features = ["all"]

[[test]]
name = "e2e"
required-features = ["all"]

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["full", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
