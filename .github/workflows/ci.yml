name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          for i in 1 2 3; do
            cargo check --all-targets && break
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          for i in 1 2 3; do
            cargo test && break
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: |
          for i in 1 2 3; do
            cargo check && break
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          for i in 1 2 3; do
            cargo doc --no-deps --document-private-items && break
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
      - name: Verify docs folder exists
        run: |
          test -d docs
          test -f docs/README.md

  publish-dry-run:
    name: Publish dry-run
    runs-on: ubuntu-latest
    needs: [check, test, fmt, clippy, msrv, docs]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          for i in 1 2 3; do
            cargo publish -p akshare --dry-run && break
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
