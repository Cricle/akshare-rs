name: Publish

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Setting version to $VERSION"
          sed -i "s|^version = \".*\"|version = \"$VERSION\"|" Cargo.toml
          sed -i "s|akshare = { path = \"crates/akshare\", version = \".*\" }|akshare = { path = \"crates/akshare\", version = \"$VERSION\" }|" Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo publish -p akshare --dry-run --allow-dirty
      - run: cargo publish -p akshare-mcp --dry-run --allow-dirty --no-verify

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s|^version = \".*\"|version = \"$VERSION\"|" Cargo.toml
          sed -i "s|akshare = { path = \"crates/akshare\", version = \".*\" }|akshare = { path = \"crates/akshare\", version = \"$VERSION\" }|" Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish akshare
        run: cargo publish -p akshare --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO }}
      - name: Publish akshare-mcp
        run: cargo publish -p akshare-mcp --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO }}

  build-release:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: akshare-mcp-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: akshare-mcp-linux-arm64
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: akshare-mcp-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: akshare-mcp-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: akshare-mcp-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s|^version = \".*\"|version = \"$VERSION\"|" Cargo.toml
          sed -i "s|akshare = { path = \"crates/akshare\", version = \".*\" }|akshare = { path = \"crates/akshare\", version = \"$VERSION\" }|" Cargo.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build -p akshare-mcp --release --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build -p akshare-mcp --release --target ${{ matrix.target }}

      - name: Rename binary (unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/akshare-mcp ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Rename binary (windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/akshare-mcp.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: [publish, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/akshare-mcp-linux-amd64/akshare-mcp-linux-amd64
            artifacts/akshare-mcp-linux-arm64/akshare-mcp-linux-arm64
            artifacts/akshare-mcp-darwin-amd64/akshare-mcp-darwin-amd64
            artifacts/akshare-mcp-darwin-arm64/akshare-mcp-darwin-arm64
            artifacts/akshare-mcp-windows-amd64.exe/akshare-mcp-windows-amd64.exe
